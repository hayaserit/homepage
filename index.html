<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>過去に戻りますか.</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url('3746863_m.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
        }
        .container-wall {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 380px;
            background-color: #dcdccb;
            background-image:
                linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            border: 4px solid #b5b5a5;
            box-shadow: 0px 10px 0px rgba(0,0,0,0.2);
            position: relative;
        }

        /* ドア = XP風ウィンドウ(外枠込みで150x290のまま) */
        .enter-btn {
            display: block;
            width: 150px;
            height: 290px;
            box-sizing: border-box;
            background: #ece9d8;
            border: 3px solid #0831d9;
            border-radius: 8px 8px 0 0;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        .xp-title {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 26px;
            padding: 0 3px 0 5px;
            background: linear-gradient(#3a8cff 0%, #0058ee 12%, #0050e0 60%, #0a5ae6 100%);
        }
        .xp-btns {
            display: flex;
            gap: 2px;
        }
        .xp-btns i {
            position: relative;
            width: 17px;
            height: 17px;
            box-sizing: border-box;
            border: 1px solid #fff;
            border-radius: 3px;
            background: linear-gradient(#6f9cf5, #2a5fd8);
        }
        .xp-btns i.close {
            background: linear-gradient(#ec8a6e, #c4401a);
        }
        .xp-btns i.min::after {
            content: "";
            position: absolute;
            left: 3px;
            bottom: 3px;
            width: 6px;
            height: 2px;
            background: #fff;
        }
        .xp-btns i.max::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 3px;
            width: 7px;
            height: 6px;
            border: 1px solid #fff;
            border-top-width: 2px;
        }
        .xp-btns i.close::after {
