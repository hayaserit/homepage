<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>過去に戻りますか.</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url('3746863_m.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
        }
        .container-wall {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 335px;
            border: 3px solid #b5b5a5;
            box-shadow: 0px 10px 0px rgba(0,0,0,0.2);
            position: relative;
        }
        .container-wall::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('IMG_8863.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        .enter-btn {
            display: block;
            width: 150px;
            height: 290px;
            background-color: #ffffff;
            text-decoration: none;
            box-sizing: border-box;
            border: 5px solid #0831d9;
            position: relative;
            z-index: 1;
        }
        .enter-text {
            position: absolute;
            bottom: 30px;
            left: 20px;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
            color: #444444;
            text-transform: uppercase;
        }
        .enter-btn:active {
            background-color: #eeeeee;
        }
    </style>
</head>
<body>
    <div class="container-wall">
        <a href="main.html" class="enter-btn">
            <span class="enter-text"></span>
        </a>
    </div>
    <script>
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('mousewheel', function(e) { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
